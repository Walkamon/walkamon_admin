name: walkamon-admin

services:
  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/walkamon/walkamon_admin:dev}
    container_name: walkamon-admin
    restart: unless-stopped
    networks:
      edge:
        aliases:
          - walkamon-admin
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=2m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    external: true
    name: walkamon_edge

